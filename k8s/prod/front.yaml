# Environnement de production
# Prérequis : kubectl create namespace prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: prod
  labels:
    app: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: dockerhub-username/app-front:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: prod
  labels:
    app: front
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
