name: 1 - CI & Build Dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, val, main]

jobs:
  lint:
    name: Lint Dockerfiles & K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
        strategy:
          matrix:
            dockerfile: [front/Dockerfile, back/Dockerfile]

      - name: Validation des manifestes Kubernetes
        uses: yannh/kubeconform-action@v0.1.0
        with:
          files: k8s/

  build-dev:
    name: Build & Push Dev (${{ matrix.service }})
    needs: lint
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push tag :dev
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:dev