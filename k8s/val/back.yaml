# Environnement de validation
# Prérequis : kubectl create namespace val
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
  namespace: val
  labels:
    app: back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
        - name: back
          image: mtchebibi/app-back:val
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: db
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: appdb
            - name: PGUSER
              value: appuser
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: APP_ENV
              value: val
            - name: APP_VERSION
              value: val
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: back
  namespace: val
  labels:
    app: back
spec:
  selector:
    app: back
  ports:
    - port: 3000
      targetPort: 3000
