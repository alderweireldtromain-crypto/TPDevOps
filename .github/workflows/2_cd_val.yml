name: 2 - CD Validation (Val)

on:
  push:
    branches: [val]

jobs:
  build-val:
    name: Build & Push Val (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push tag :val
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:val
            ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:val-${{ github.sha }}

  deploy-val:
    name: Déploiement K8s Val
    needs: build-val
    runs-on: self-hosted # Poste hébergeant K8s
    steps:
      - uses: actions/checkout@v4

      - name: Appliquer les manifestes Val
        run: |
          kubectl apply -f k8s/val/ -n val
          kubectl rollout restart deployment -n val