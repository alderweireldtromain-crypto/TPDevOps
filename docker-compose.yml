services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  back:
    build: ./back
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD: devpassword
      APP_ENV: dev
      APP_VERSION: local
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  front:
    build: ./front
    ports:
      - "8080:8080"
    depends_on:
      - back

volumes:
  postgres-data:
