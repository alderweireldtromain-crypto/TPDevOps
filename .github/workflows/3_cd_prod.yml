name: 3 - CD Production (Prod)

on:
  push:
    branches: [main]

jobs:
  build-prod:
    name: Build & Push Prod (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push tag :prod
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-${{ matrix.service }}:prod-${{ github.sha }}

  deploy-prod:
    name: Déploiement K8s Prod
    needs: build-prod
    runs-on: self-hosted # Poste hébergeant K8s
    steps:
      - uses: actions/checkout@v4

      - name: Appliquer les manifestes Prod
        run: |
          kubectl apply -f k8s/prod/ -n prod
          kubectl rollout restart deployment -n prod